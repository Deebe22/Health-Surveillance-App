name: health_surveillance_app
description: A Flutter Smart Health Surveillance App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ☁️ Backend (Firebase)
  firebase_core: ^3.10.0
  cloud_firestore: ^5.6.0

  # Icons
  cupertino_icons: ^1.0.8

  # ✅ Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0

  # Storage
  shared_preferences: ^2.5.3
  http: ^1.2.1

  # Location
  geolocator: ^10.0.0

  # Image picker
  image_picker: ^1.1.0
  video_player: ^2.11.1
  audioplayers: ^6.6.0
  youtube_explode_dart: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # ✅ REQUIRED for localization
  generate: true

  assets:
    - assets/images/
    - assets/audio/
    - assets/video/